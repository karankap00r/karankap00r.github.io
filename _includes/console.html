<div class="console" id="console" hidden role="region" aria-label="Console" data-dock="float">
  <div class="console-grip" aria-hidden="true"></div>
  <div class="console-bar">
    <span class="console-bar-title">console<small id="console-mode"></small></span>
    <button type="button" class="console-btn" data-console-dock title="Cycle dock: float → bottom → right → top → left">dock</button>
    <button type="button" class="console-btn" data-console-expand title="Expand / restore">expand</button>
    <button type="button" class="console-close" aria-label="Close console" title="Close (Esc)">×</button>
  </div>
  <div class="console-out" id="console-out" aria-live="polite"></div>
  <form class="console-form" id="console-form" autocomplete="off">
    <span class="console-prompt" aria-hidden="true">$</span>
    <input class="console-in" id="console-in" type="text" spellcheck="false" autocapitalize="off" aria-label="Command">
  </form>
</div>
<script src="{{ '/assets/js/console.js' | relative_url }}?v={{ site.time | date: '%s' }}"></script>
