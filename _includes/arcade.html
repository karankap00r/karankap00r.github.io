<div class="arcade" id="arcade" hidden role="dialog" aria-modal="true" aria-label="Arcade">
  <div class="arcade-box">
    <button type="button" class="arcade-close" aria-label="Close (Esc)">×</button>
    <div class="arcade-gate" id="arcade-gate">
      <p class="arcade-title" id="arcade-gate-title">SECRET CODE</p>
      <form id="arcade-form" autocomplete="off">
        <input id="arcade-code" type="text" autocapitalize="off" spellcheck="false" placeholder="enter code" aria-label="Secret code">
        <button type="submit">enter</button>
      </form>
      <p class="arcade-hint" id="arcade-hint" aria-live="polite"></p>
    </div>
    <div class="arcade-game" id="arcade-game" hidden>
      <div class="arcade-hud"><span id="arcade-score">SCORE 0</span><span id="arcade-title"></span><span id="arcade-lives">♥♥♥</span></div>
      <canvas id="arcade-canvas" width="480" height="360" aria-label="Breakout"></canvas>
      <p class="arcade-help">← → or mouse to move · space to launch · esc to quit</p>
    </div>
  </div>
</div>
<script>
  /* Hidden arcade. In matrix, avengers or star-wars, ten clicks anywhere on
     the site (within a few seconds) open a gate; the code "play" (any case)
     starts an Atari-style Breakout dressed in that theme. Nothing on the
     page hints at it. */
  (function () {
    var root = document.documentElement;
    var box = document.getElementById('arcade'), gate = document.getElementById('arcade-gate'), game = document.getElementById('arcade-game');
    var form = document.getElementById('arcade-form'), code = document.getElementById('arcade-code'), hint = document.getElementById('arcade-hint');
    var canvas = document.getElementById('arcade-canvas'), hudScore = document.getElementById('arcade-score'), hudLives = document.getElementById('arcade-lives');
    var hudTitle = document.getElementById('arcade-title'), gateTitle = document.getElementById('arcade-gate-title');
    if (!box || !canvas) return;
    var ctx = canvas.getContext('2d'), W = canvas.width, H = canvas.height;

    var SKINS = {
      'matrix': {
        title: 'THE MATRIX HAS YOU', gateTitle: 'WAKE UP, NEO', font: '"Share Tech Mono", monospace',
        bg: '#000000', bricks: ['#00ff41', '#00b32d', '#7dff9a', '#00ff41', '#00b32d'], paddle: '#00ff41', ball: '#7dff9a', text: '#00ff41',
        glyphs: 'ｱｲｳｴｵｶｷｸｹｺ01', rain: true,
        launch: 'FOLLOW THE WHITE RABBIT · SPACE', over: 'SYSTEM FAILURE', win: 'THERE IS NO SPOON', hints: ['Not that one.', 'Knock, knock, Neo.', 'One word.', 'Think Atari.']
      },
      'star-wars': {
        title: 'REBEL BREAKOUT', gateTitle: 'IMPERIAL CLEARANCE CODE', font: 'Orbitron, monospace',
        bg: '#000000', bricks: ['#ffe81f'], paddle: '#4bd5ff', ball: '#ff3b3b', text: '#ffe81f',
        glyphs: '', stars: true, hollow: true, saber: true, bolt: true,
        launch: 'PUNCH IT · SPACE', over: 'I HAVE A BAD FEELING ABOUT THIS', win: 'THE FORCE IS WITH YOU', hints: ['These aren\'t the codes you\'re looking for.', 'Try again, young one.', 'One word.', 'Think Atari.']
      },
      'avengers': {
        title: 'ASSEMBLE', gateTitle: 'S.H.I.E.L.D. CLEARANCE', font: 'Anton, Impact, sans-serif',
        bg: '#0b0f1a', bricks: ['#e2231a', '#e0b33a', '#e2231a', '#e0b33a', '#9be7ff'], paddle: '#e0b33a', ball: '#9be7ff', text: '#f2f2f2',
        glyphs: '', metal: true, shield: true, ring: true,
        launch: 'AVENGERS, ASSEMBLE · SPACE', over: 'WHATEVER IT TAKES', win: 'I AM IRON MAN', hints: ['Access denied.', 'Level 7 only.', 'One word.', 'Think Atari.']
      }
    };
    function theme() { return root.getAttribute('data-theme') || 'system'; }
    function armed() { return !!SKINS[theme()]; }
    function skin() { return SKINS[theme()] || SKINS['matrix']; }
    function beep(f, d) { if (window.site && window.site.sound && window.site.sound.beep) window.site.sound.beep(f, d); }

    /* ---- the gate: ten clicks anywhere, inside a few seconds ---- */
    var clicks = [], NEEDED = 10, WINDOW = 6000;
    document.addEventListener('click', function (e) {
      if (!armed() || !box.hidden || e.target.closest('.arcade, .console')) return;
      var now = Date.now(); clicks = clicks.filter(function (t) { return now - t < WINDOW; }); clicks.push(now);
      if (clicks.length >= NEEDED) { clicks = []; openGate(); }
    });
    function openGate() {
      gateTitle.textContent = skin().gateTitle;
      box.hidden = false; gate.hidden = false; game.hidden = true; hint.textContent = ''; code.value = '';
      document.body.classList.add('arcade-open'); code.focus();
    }
    function close() { stopGame(); box.hidden = true; document.body.classList.remove('arcade-open'); }
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      if (code.value.trim().toLowerCase() === 'play') { hint.textContent = ''; gate.hidden = true; game.hidden = false; startGame(); }
      else { var h = skin().hints; hint.textContent = h[Math.floor(Math.random() * h.length)]; gate.classList.remove('shake'); void gate.offsetWidth; gate.classList.add('shake'); code.select(); beep(180, 0.12); }
    });
    box.querySelector('.arcade-close').addEventListener('click', close);
    box.addEventListener('click', function (e) { if (e.target === box) close(); });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !box.hidden) { close(); e.stopPropagation(); } }, true);

    /* ---- Breakout ---- */
    var S = null, raf = null, last = 0, keys = {}, stars = [], drops = [];
    function stopGame() { if (raf) cancelAnimationFrame(raf); raf = null; S = null; window.removeEventListener('keydown', onKey); window.removeEventListener('keyup', onKeyUp); }
    function onKey(e) {
      if (!S) return;
      if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') { keys[e.key] = true; e.preventDefault(); }
      if (e.key === ' ') { e.preventDefault(); if (S.over) restart(); else S.launched = true; }
    }
    function onKeyUp(e) { keys[e.key] = false; }
    canvas.addEventListener('pointermove', function (e) { if (!S) return; var r = canvas.getBoundingClientRect(); S.paddle.x = Math.max(0, Math.min(W - S.paddle.w, (e.clientX - r.left) * (W / r.width) - S.paddle.w / 2)); });
    canvas.addEventListener('pointerdown', function () { if (!S) return; if (S.over) restart(); else S.launched = true; });

    function bricksFor(level) {
      var rows = 5, cols = 10, pad = 4, top = 40, bw = (W - pad * (cols + 1)) / cols, bh = 16, out = [], k = skin();
      for (var r = 0; r < rows; r++) for (var c = 0; c < cols; c++)
        out.push({ x: pad + c * (bw + pad), y: top + r * (bh + pad), w: bw, h: bh, color: k.bricks[r % k.bricks.length], hp: (level > 1 && r < 2) ? 2 : 1, glyph: k.glyphs ? k.glyphs[Math.floor(Math.random() * k.glyphs.length)] : '' });
      return out;
    }
    function reset(level, score, lives) {
      S = { level: level, score: score, lives: lives, over: false, won: false, launched: false, speed: 240 * Math.pow(1.15, level - 1),
            paddle: { x: W / 2 - 35, w: 70, h: 8 }, ball: { x: W / 2, y: H - 30, r: 5, vx: 0, vy: 0 }, bricks: bricksFor(level) };
      hud();
    }
    function restart() { reset(1, 0, 3); }
    function startGame() {
      var k = skin(); hudTitle.textContent = k.title;
      stars = []; for (var i = 0; i < 60; i++) stars.push([Math.random() * W, Math.random() * H, Math.random() * 1.4 + 0.3]);
      drops = []; for (var c = 0; c < W / 14; c++) drops.push(Math.random() * -H);
      window.addEventListener('keydown', onKey); window.addEventListener('keyup', onKeyUp);
      restart(); last = 0; raf = requestAnimationFrame(tick); canvas.focus();
    }
    function hud() { hudScore.textContent = 'SCORE ' + S.score + '  LVL ' + S.level; hudLives.textContent = new Array(S.lives + 1).join('♥') || '—'; }

    function step(dt) {
      var p = S.paddle, b = S.ball;
      if (keys.ArrowLeft) p.x -= 320 * dt; if (keys.ArrowRight) p.x += 320 * dt;
      p.x = Math.max(0, Math.min(W - p.w, p.x));
      if (!S.launched) { b.x = p.x + p.w / 2; b.y = H - 30; return; }
      if (b.vx === 0 && b.vy === 0) { var a = -Math.PI / 3 - Math.random() * Math.PI / 3; b.vx = Math.cos(a) * S.speed; b.vy = Math.sin(a) * S.speed; }
      b.x += b.vx * dt; b.y += b.vy * dt;
      if (b.x < b.r) { b.x = b.r; b.vx = -b.vx; beep(300, 0.03); } if (b.x > W - b.r) { b.x = W - b.r; b.vx = -b.vx; beep(300, 0.03); }
      if (b.y < b.r) { b.y = b.r; b.vy = -b.vy; beep(300, 0.03); }
      if (b.vy > 0 && b.y + b.r >= H - 20 && b.y + b.r <= H - 20 + p.h + 6 && b.x >= p.x - b.r && b.x <= p.x + p.w + b.r) {
        var rel = (b.x - (p.x + p.w / 2)) / (p.w / 2), ang = rel * (Math.PI / 3), sp = Math.hypot(b.vx, b.vy) * 1.02;
        b.vx = Math.sin(ang) * sp; b.vy = -Math.cos(ang) * sp; b.y = H - 20 - b.r; beep(440, 0.04);
      }
      for (var i = 0; i < S.bricks.length; i++) {
        var k = S.bricks[i];
        if (b.x + b.r > k.x && b.x - b.r < k.x + k.w && b.y + b.r > k.y && b.y - b.r < k.y + k.h) {
          var ox = Math.min(b.x + b.r - k.x, k.x + k.w - (b.x - b.r)), oy = Math.min(b.y + b.r - k.y, k.y + k.h - (b.y - b.r));
          if (ox < oy) b.vx = -b.vx; else b.vy = -b.vy;
          k.hp--; if (k.hp <= 0) { S.bricks.splice(i, 1); S.score += 10 * S.level; } else S.score += 5;
          beep(600 + Math.random() * 400, 0.05); hud(); break;
        }
      }
      if (b.y > H + b.r) {
        S.lives--; beep(120, 0.25); hud();
        if (S.lives <= 0) { S.over = true; S.won = false; } else { S.launched = false; b.vx = b.vy = 0; }
      }
      if (!S.bricks.length) { S.level++; if (S.level > 5) { S.over = true; S.won = true; } else { var sc = S.score, lv = S.lives; reset(S.level, sc, lv); beep(880, 0.2); } }
    }

    function draw(dt) {
      var k = skin(), p = S.paddle, b = S.ball;
      ctx.fillStyle = k.bg; ctx.fillRect(0, 0, W, H);
      if (k.stars) { ctx.fillStyle = '#ffffff'; ctx.globalAlpha = 0.5; stars.forEach(function (s) { ctx.fillRect(s[0], s[1], s[2], s[2]); }); ctx.globalAlpha = 1; }
      if (k.rain) {
        ctx.font = '12px ' + k.font; ctx.textAlign = 'center'; ctx.globalAlpha = 0.18; ctx.fillStyle = k.text;
        for (var c = 0; c < drops.length; c++) { drops[c] += 90 * dt; if (drops[c] > H) drops[c] = Math.random() * -H; ctx.fillText(k.glyphs[Math.floor(Math.random() * k.glyphs.length)], c * 14 + 7, drops[c]); }
        ctx.globalAlpha = 1;
      }
      S.bricks.forEach(function (r) {
        if (k.hollow) { ctx.strokeStyle = r.color; ctx.lineWidth = r.hp > 1 ? 3 : 2; ctx.strokeRect(r.x + 1, r.y + 1, r.w - 2, r.h - 2); return; }
        if (k.metal) { var g = ctx.createLinearGradient(0, r.y, 0, r.y + r.h); g.addColorStop(0, '#ffffff'); g.addColorStop(0.25, r.color); g.addColorStop(1, r.color); ctx.fillStyle = g; }
        else ctx.fillStyle = r.color;
        ctx.globalAlpha = r.hp > 1 ? 1 : 0.85; ctx.fillRect(r.x, r.y, r.w, r.h); ctx.globalAlpha = 1;
        if (r.glyph) { ctx.fillStyle = k.bg; ctx.font = '11px ' + k.font; ctx.textAlign = 'center'; ctx.fillText(r.glyph, r.x + r.w / 2, r.y + 12); }
      });
      /* paddle */
      if (k.saber) {
        ctx.fillStyle = '#9a9a9a'; ctx.fillRect(p.x - 12, H - 21, 12, 10);                       /* hilt */
        ctx.fillStyle = k.paddle; ctx.shadowColor = k.paddle; ctx.shadowBlur = 16; ctx.fillRect(p.x, H - 20, p.w, p.h);
        ctx.fillStyle = '#ffffff'; ctx.shadowBlur = 0; ctx.fillRect(p.x, H - 18, p.w, 3);          /* white core */
      } else if (k.shield) {
        ctx.fillStyle = '#e2231a'; ctx.fillRect(p.x, H - 20, p.w, p.h);
        ctx.fillStyle = '#f2f2f2'; ctx.fillRect(p.x + 8, H - 20, p.w - 16, p.h);
        ctx.fillStyle = '#2b5fd9'; ctx.fillRect(p.x + p.w / 2 - 8, H - 20, 16, p.h);
        ctx.fillStyle = k.paddle; ctx.fillRect(p.x + p.w / 2 - 3, H - 20, 6, p.h);
      } else {
        ctx.fillStyle = k.paddle; ctx.shadowColor = k.paddle; ctx.shadowBlur = 10; ctx.fillRect(p.x, H - 20, p.w, p.h); ctx.shadowBlur = 0;
      }
      /* ball */
      ctx.fillStyle = k.ball; ctx.shadowColor = k.ball; ctx.shadowBlur = 12;
      if (k.ring) { ctx.beginPath(); ctx.arc(b.x, b.y, b.r + 2, 0, 6.28); ctx.strokeStyle = k.ball; ctx.lineWidth = 2; ctx.stroke(); ctx.beginPath(); ctx.arc(b.x, b.y, 2, 0, 6.28); ctx.fill(); }
      else if (k.bolt && (b.vx || b.vy)) { var L = 14, n = Math.hypot(b.vx, b.vy) || 1; ctx.strokeStyle = k.ball; ctx.lineWidth = 3; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(b.x - b.vx / n * L, b.y - b.vy / n * L); ctx.lineTo(b.x + b.vx / n * L / 2, b.y + b.vy / n * L / 2); ctx.stroke(); }
      else { ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 6.28); ctx.fill(); }
      ctx.shadowBlur = 0;
      ctx.fillStyle = k.text; ctx.font = '14px ' + k.font; ctx.textAlign = 'center';
      if (!S.launched && !S.over) ctx.fillText(k.launch, W / 2, H / 2 + 40);
      if (S.over) { ctx.font = 'bold 22px ' + k.font; ctx.fillText(S.won ? k.win : k.over, W / 2, H / 2 - 8); ctx.font = '14px ' + k.font; ctx.fillText('SCORE ' + S.score + ' · SPACE TO PLAY AGAIN', W / 2, H / 2 + 20); }
    }
    function frame(dt) { if (!S) return; if (!S.over) step(dt); draw(dt); }
    function tick(t) {
      raf = requestAnimationFrame(tick);
      if (document.hidden) { last = 0; return; }
      var dt = last ? Math.min((t - last) / 1000, 0.05) : 1 / 60; last = t;
      frame(dt);
    }

    window.site = window.site || {};
    window.site.arcade = { open: openGate, close: close, armed: armed, frame: function (dt) { frame(dt || 1 / 60); }, state: function () { return S; } };
  })();
</script>
