<div class="arcade" id="arcade" hidden role="dialog" aria-modal="true" aria-label="Arcade">
  <div class="arcade-box">
    <button type="button" class="arcade-close" aria-label="Close (Esc)">×</button>
    <div class="arcade-gate" id="arcade-gate">
      <p class="arcade-title" id="arcade-gate-title">SECRET CODE</p>
      <form id="arcade-form" autocomplete="off">
        <input id="arcade-code" type="text" autocapitalize="off" spellcheck="false" placeholder="enter code" aria-label="Secret code">
        <button type="submit">enter</button>
      </form>
      <p class="arcade-hint" id="arcade-hint" aria-live="polite"></p>
    </div>
    <div class="arcade-menu" id="arcade-menu" hidden>
      <p class="arcade-title">CHOOSE YOUR GAME</p>
      <div class="arcade-menu-list"></div>
      <p class="arcade-help">press a number · esc to leave</p>
    </div>
    <div class="arcade-game" id="arcade-game" hidden>
      <div class="arcade-hud"><span id="arcade-score">SCORE 0</span><span id="arcade-title"></span><span id="arcade-lives">♥♥♥</span></div>
      <div class="arcade-stage">
        <canvas id="arcade-canvas" width="480" height="360" aria-label="Game"></canvas>
        <div class="arcade-buddy" aria-hidden="true">
          <div class="arcade-bubble" id="arcade-bubble" hidden></div>
          <canvas id="arcade-buddy" width="140" height="220"></canvas>
        </div>
      </div>
      <p class="arcade-help" id="arcade-help"></p>
      <div class="arcade-actions">
        <button type="button" class="arcade-exit" data-arcade-menu>MENU <small>m</small></button>
        <button type="button" class="arcade-exit" data-arcade-exit>EXIT <small>esc / q</small></button>
      </div>
    </div>
  </div>
</div>
{% assign v = site.time | date: '%s' %}
<script src="{{ '/assets/js/arcade/core.js' | relative_url }}?v={{ v }}"></script>
<script src="{{ '/assets/js/arcade/companions.js' | relative_url }}?v={{ v }}"></script>
<script src="{{ '/assets/js/arcade/breakout.js' | relative_url }}?v={{ v }}"></script>
<script src="{{ '/assets/js/arcade/shooter.js' | relative_url }}?v={{ v }}"></script>
