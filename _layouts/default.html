<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title and page.url != "/" %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <meta name="author" content="{{ site.author }}">
  <meta property="og:title" content="{{ page.title | default: site.title }}">
  <meta property="og:description" content="{{ page.description | default: site.description }}">
  <meta property="og:type" content="website">
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='0' y='0' width='8' height='8' fill='%231a1a1a'/%3E%3Crect x='8' y='8' width='8' height='8' fill='%231a1a1a'/%3E%3C/svg%3E">

  <!-- Theme restore — runs synchronously before paint to avoid flash. -->
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('theme');
        if (saved === 'light' || saved === 'dark') {
          document.documentElement.setAttribute('data-theme', saved);
        }
      } catch (e) { /* private mode etc. — fall through to OS preference */ }
    })();
  </script>
</head>
<body>
  <!-- Top-left corner ornament — small block cluster -->
  <svg class="deco-corner" viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
    <rect class="p-1" x="0"  y="0"  width="12" height="12"/>
    <rect class="p-2" x="12" y="0"  width="12" height="12"/>
    <rect class="p-3" x="0"  y="12" width="12" height="12"/>
  </svg>

  <!-- Top-right corner ornament — mirrored S-piece silhouette -->
  <svg class="deco-corner-tr" viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
    <rect class="p-1" x="12" y="0"  width="12" height="12"/>
    <rect class="p-2" x="24" y="0"  width="12" height="12"/>
    <rect class="p-3" x="0"  y="12" width="12" height="12"/>
    <rect class="p-3" x="12" y="12" width="12" height="12"/>
  </svg>

  <!-- Vertical pixel ribbon along the left edge, vertically centered -->
  <div class="deco-ribbon" aria-hidden="true"></div>

  <!-- Mid-left small floating L-piece -->
  <svg class="deco-float-left" viewBox="0 0 36 48" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
    <rect class="p-1" x="0"  y="0"  width="12" height="12"/>
    <rect class="p-2" x="0"  y="12" width="12" height="12"/>
    <rect class="p-3" x="0"  y="24" width="12" height="12"/>
    <rect class="p-4" x="12" y="24" width="12" height="12"/>
  </svg>

  {% include header.html %}
  <main>
    {{ content }}
  </main>
  {% include footer.html %}

  <!-- Decorative tetris stack, bottom-right. Hidden on small screens. -->
  <svg class="deco-tetris" viewBox="0 0 96 192" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
    <g class="p-i">
      <rect x="0"  y="180" width="12" height="12"/>
      <rect x="12" y="180" width="12" height="12"/>
      <rect x="24" y="180" width="12" height="12"/>
      <rect x="36" y="180" width="12" height="12"/>
    </g>
    <g class="p-o">
      <rect x="72" y="180" width="12" height="12"/>
      <rect x="84" y="180" width="12" height="12"/>
      <rect x="72" y="168" width="12" height="12"/>
      <rect x="84" y="168" width="12" height="12"/>
    </g>
    <g class="p-l">
      <rect x="48" y="180" width="12" height="12"/>
      <rect x="48" y="168" width="12" height="12"/>
      <rect x="48" y="156" width="12" height="12"/>
      <rect x="60" y="156" width="12" height="12"/>
    </g>
    <g class="p-t">
      <rect x="0"  y="144" width="12" height="12"/>
      <rect x="12" y="144" width="12" height="12"/>
      <rect x="24" y="144" width="12" height="12"/>
      <rect x="12" y="132" width="12" height="12"/>
    </g>
    <g class="p-s">
      <rect x="48" y="144" width="12" height="12"/>
      <rect x="60" y="144" width="12" height="12"/>
      <rect x="60" y="132" width="12" height="12"/>
      <rect x="72" y="132" width="12" height="12"/>
    </g>
    <g class="p-j">
      <rect x="84" y="84"  width="12" height="12"/>
      <rect x="84" y="96"  width="12" height="12"/>
      <rect x="84" y="108" width="12" height="12"/>
      <rect x="72" y="108" width="12" height="12"/>
    </g>
    <g class="p-z">
      <rect x="0"  y="108" width="12" height="12"/>
      <rect x="12" y="108" width="12" height="12"/>
      <rect x="12" y="120" width="12" height="12"/>
      <rect x="24" y="120" width="12" height="12"/>
    </g>
    <g class="p-o2">
      <rect x="36" y="48" width="12" height="12"/>
      <rect x="48" y="48" width="12" height="12"/>
      <rect x="36" y="60" width="12" height="12"/>
      <rect x="48" y="60" width="12" height="12"/>
    </g>
    <g class="p-i2">
      <rect x="0"  y="0"  width="12" height="12"/>
      <rect x="0"  y="12" width="12" height="12"/>
      <rect x="0"  y="24" width="12" height="12"/>
      <rect x="0"  y="36" width="12" height="12"/>
    </g>
  </svg>

  <!-- Theme toggle behavior. Inline so there's no extra request. -->
  <script>
    (function () {
      var btn = document.querySelector('.theme-toggle');
      if (!btn) return;
      btn.addEventListener('click', function () {
        var root = document.documentElement;
        var current = root.getAttribute('data-theme');
        if (!current) {
          // No explicit theme yet — flip away from the OS preference.
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          current = prefersDark ? 'dark' : 'light';
        }
        var next = current === 'dark' ? 'light' : 'dark';
        root.setAttribute('data-theme', next);
        try { localStorage.setItem('theme', next); } catch (e) {}
      });
    })();
  </script>
</body>
</html>
