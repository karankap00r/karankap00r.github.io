<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title and page.url != "/" %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <meta name="author" content="{{ site.author }}">
  <meta property="og:title" content="{{ page.title | default: site.title }}">
  <meta property="og:description" content="{{ page.description | default: site.description }}">
  <meta property="og:type" content="website">
  <link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">

  <!-- Newsreader: full weight + italic range, optical sizing. Same as darioamodei.com. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,200..800;1,6..72,200..800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}?v={{ site.time | date: '%s' }}">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23f5efe4'/%3E%3Ctext x='2' y='13' font-family='Georgia,serif' font-size='13' fill='%232a241e'%3EK%3C/text%3E%3C/svg%3E">

  {% include site-config.html %}

  <!-- Theme restore. Stays inline on purpose: it must run before first paint
       so a saved theme never flashes. Everything else lives in assets/js. -->
  <script>
    (function () {
      try {
        var C = window.SITE || {}, root = document.documentElement;
        var saved = localStorage.getItem('theme');
        // ?theme=<name> in the URL picks a theme (and keeps it), so links can carry one.
        var fromUrl = new URLSearchParams(location.search).get('theme');
        if (fromUrl && /^[a-z0-9-]+$/.test(fromUrl)) {
          saved = fromUrl;
          try { localStorage.removeItem('theme.flip'); if (saved === 'system' || saved === 'default') localStorage.removeItem('theme'); else localStorage.setItem('theme', saved); } catch (e) {}
        }
        if (saved && saved !== 'system' && saved !== 'default') root.setAttribute('data-theme', saved);
        // Some themes bring their own web font; load it only when that theme is on.
        var FONTS = C.themeFonts || {};
        window.__ensureFont = function (t) {
          var u = FONTS[t];
          if (!u || document.querySelector('link[data-theme-font="' + t + '"]')) return;
          var l = document.createElement('link');
          l.rel = 'stylesheet'; l.href = u; l.setAttribute('data-theme-font', t);
          document.head.appendChild(l);
        };
        if (saved) window.__ensureFont(saved);
        var dark = saved && saved !== 'system'
          ? (C.themesDark || []).indexOf(saved) >= 0
          : window.matchMedia('(prefers-color-scheme: dark)').matches;
        // A theme without a light/dark twin can be flipped in place (see theme.js).
        var flip = false;
        try { flip = !!localStorage.getItem('theme.flip') && !!saved && saved !== 'system' && saved !== 'default'; } catch (e) {}
        if (flip) { root.setAttribute('data-flip', '1'); dark = !dark; }
        root.setAttribute('data-scheme', dark ? 'dark' : 'light');
        root.style.colorScheme = dark ? 'dark' : 'light';
      } catch (e) { /* private mode etc. */ }
    })();
  </script>
</head>
<body>
  {% include header.html %}
  <main>
    {{ content }}
  </main>
  {% include footer.html %}

  <!-- Behaviour, one file per feature (see assets/js). Order matters: theme
       first, then the layers that read it; the console and arcade last. -->
  <script src="{{ '/assets/js/theme.js' | relative_url }}?v={{ site.time | date: '%s' }}"></script>
  {% include ambient.html %}
  {% include pets.html %}
  {% include console.html %}
  {% include lightbox.html %}
  {% include fx.html %}
  {% include sound.html %}
  {% include arcade.html %}
</body>
</html>
