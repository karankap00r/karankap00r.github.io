title: Karan Kapoor
description: Staff Software Engineer working on distributed systems, AI, and engineering leadership. Notes and small tools on the side.
author: Karan Kapoor
email: karankapoor.nsit@gmail.com

# Deployment
# - User site (username.github.io): leave url and baseurl empty.
# - Project site (username.github.io/repo-name): set baseurl to "/repo-name".
# - Custom domain: set url to "https://yourdomain.com" and add a CNAME file.
url: "https://karankapoor.dev"
baseurl: ""

# Build
markdown: kramdown
permalink: pretty
timezone: UTC

# No theme — all layouts/includes/assets live in this repo.
theme: null

# Plugins. jekyll-feed generates /feed.xml with all blog posts.
# (github-pages gem includes both of these by default.)
plugins:
  - jekyll-feed
  - jekyll-seo-tag

# RSS feed config (consumed by jekyll-feed).
feed:
  path: feed.xml

# Projects live in _projects/ as one .md file per project. Front matter holds
# the metadata; the markdown body is what shows up on the per-project page.
collections:
  projects:
    output: true
    permalink: /projects/:path/

# Default layout for everything in the projects collection.
defaults:
  - scope:
      path: ""
      type: projects
    values:
      layout: project

# Top navigation. Order controls render order.
nav:
  - { label: "Home",       url: "/",            key: "h" }
  - { label: "Prototypes", url: "/prototypes/", key: "p" }
  - { label: "Writing",    url: "/blogs/",      key: "w" }
  - { label: "Career",     url: "/career/",     key: "c" }
  - { label: "About",      url: "/about/",      key: "a" }

# Themes. Each name must have a `:root[data-theme="<name>"]` block in
# assets/style.css. The dark list drives the sun/moon icon and color-scheme.
# "default" and "system" are implicit and mean: follow the OS.
themes_light:
  - light
  - paper
  - omaha
  - web-rings
  - valentines-day
  - st-patricks-day
  - solarized-light
  - gruvbox-light
  - catppuccin-latte
  - jetbrains-light
  - rain
  - snow
  - sunshine
themes_dark:
  - jetbrains-dark
  - star-wars
  - avengers
  - matrix
  - cyberpunk
  - storm
  - dark
  - night-owl
  - crt-red
  - crt-amber
  - crt-green
  - crt-mono
  - 90s-vibes
  - solarized-dark
  - dracula
  - nord
  - gruvbox-dark
  - catppuccin-mocha
  - tokyo-night

# Groups for `theme list --<group>` in the console. Every theme should be in one.
theme_groups:
  site:     [light, dark, paper, night-owl, omaha]
  trendy:   [star-wars, avengers, matrix, cyberpunk, jetbrains-dark, jetbrains-light]
  editor:   [solarized-light, solarized-dark, dracula, nord, gruvbox-dark, gruvbox-light, catppuccin-mocha, catppuccin-latte, tokyo-night]
  retro:    [web-rings, 90s-vibes, crt-red, crt-amber, crt-green, crt-mono]
  seasonal: [valentines-day, st-patricks-day]
  weather:  [rain, snow, sunshine, storm]

# Web fonts a theme needs. Loaded only when that theme is set.
theme_fonts:
  rain: "https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap"
  snow: "https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@400;600&display=swap"
  sunshine: "https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap"
  storm: "https://fonts.googleapis.com/css2?family=Oswald:wght@400;500&display=swap"
  star-wars: "https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Exo+2:wght@400;500&display=swap"
  cyberpunk: "https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Rajdhani:wght@500;600&display=swap"
  avengers: "https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;500&display=swap"
  matrix: "https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap"
  jetbrains-dark: "https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap"
  jetbrains-light: "https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap"

# One place for "who I am / what I'm doing now". Rendered on the homepage
# (Currently) and by the console's `whoami`. Edit here, both update.
whoami: "Karan Kapoor — Staff Software Engineer at Zepto. I lead product and infrastructure engineering teams, and I put as much care into growing engineers and a healthy engineering culture as into the systems themselves."
now:
  - "Building a self-healing catalog at Zepto: catalog rules enforced with GenAI."
  - "Driving standardisation across Zepto's cache platform."
  - "Working on SDLC productivity initiatives such as centralised PR reviews, a feedback loop for self-improving agents, Skills Studio, and MCP Gateway."

# How many recent items to preview on the homepage.
home:
  recent_projects: 6
  recent_posts: 4

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - README.md
  - .bundle
  - node_modules
  - .DS_Store
