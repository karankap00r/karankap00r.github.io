  <!-- Theme restore — runs synchronously before paint to avoid flash. -->
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('theme');
        if (saved === 'light' || saved === 'dark') {
          document.documentElement.setAttribute('data-theme', saved);
        }
      } catch (e) { /* private mode etc. — fall through to OS preference */ }
    })();
  </script>

  <!-- Theme toggle behavior. Inline so there's no extra request. -->
  <script>
    (function () {
      var btn = document.querySelector('.theme-toggle');
      if (!btn) return;
      btn.addEventListener('click', function () {
        var root = document.documentElement;
        var current = root.getAttribute('data-theme');
        if (!current) {
          // No explicit theme yet — flip away from the OS preference.
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          current = prefersDark ? 'dark' : 'light';
        }
        var next = current === 'dark' ? 'light' : 'dark';
        root.setAttribute('data-theme', next);
        try { localStorage.setItem('theme', next); } catch (e) {}
      });
    })();
  </script>
